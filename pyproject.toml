[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nvidia-financial-rag"
version = "0.1.0"
description = "Evidence-first NVIDIA financial-report RAG learning project"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY.md"]
authors = [{name = "Zhentong Ye"}]
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.27,<2",
  "numpy>=2.0,<3",
  "scikit-learn>=1.6,<2",
  "tiktoken>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.40,<1", "httpx>=0.27,<1"]
demo = [
  "fastapi>=0.115,<1",
  "gradio>=5.44,<5.45",
  "gradio-client>=1.12,<2",
  "uvicorn[standard]>=0.40,<1",
]
semantic = ["sentence-transformers>=5,<6"]
generation = ["httpx>=0.27,<1", "transformers>=4.37,<5"]

[project.urls]
Repository = "https://github.com/1235357/nvidia-financial-rag"

[project.scripts]
nvidia-rag-serve-corpus = "nvidia_rag.serving:main"
nvidia-rag-evaluate = "nvidia_rag.evaluation_cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["nvidia_rag*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
